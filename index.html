<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسابقة اعرف واكسب v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; max-width:100%; overflow-x:hidden; }
  body { font-family:'Cairo',system-ui,sans-serif; background:linear-gradient(135deg,#2E1065 0%,#7C3AED 55%,#6D28D9 100%); min-height:100vh; color:#fff; overflow-x:hidden; overflow-wrap:anywhere; word-break:break-word; }
  .phone { max-width:430px; margin:0 auto; min-height:100vh; position:relative; padding:20px 16px 30px; overflow-x:hidden; }
  img { max-width:100%; }
  .blob { position:absolute; border-radius:50%; pointer-events:none; max-width:100%; }
  .b1 { width:230px; height:230px; background:rgba(245,158,11,.14); top:-40px; right:-20px; }
  .b2 { width:200px; height:200px; background:rgba(139,92,246,.16); top:120px; left:-20px; }
  .b3 { width:260px; height:260px; background:rgba(251,191,36,.10); bottom:-40px; right:-20px; }

  .header { display:flex; align-items:center; justify-content:center; position:relative; z-index:2; flex-wrap:wrap; row-gap:8px; }
  .header > * { min-width:0; }
  .title-badge { background:linear-gradient(90deg,#F59E0B,#FBBF24); border-radius:20px; padding:10px 16px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 22px rgba(245,158,11,.45); }
  .title-badge span { font-size:21px; font-weight:900; color:#2E1065; }
  .player-line { margin-top:12px; font-size:13.5px; color:rgba(255,255,255,.7); font-weight:700; position:relative; z-index:2; }

  .card { border-radius:22px; padding:16px; margin-top:16px; position:relative; z-index:2; }
  .form-card { background:rgba(255,255,255,.06); border:1.2px solid rgba(255,255,255,.14); }
  .fact-card { background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05)); border:1.2px solid rgba(245,158,11,.55); }
  .q-card { background:rgba(255,255,255,.06); border:1.2px solid rgba(255,255,255,.14); }
  .card-title { display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; }
  .fact-card .card-title { color:#FBBF24; }
  .q-card .card-title { color:#A78BFA; }
  .fact-text { font-size:16.5px; line-height:1.65; margin-top:10px; font-weight:500; }
  .q-text { font-size:17.5px; line-height:1.55; margin-top:12px; font-weight:700; }

  .logo-wrap { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:10px; margin-top:14px; position:relative; z-index:2; }
  .logo-wrap .logo-main { width:250px; height:250px; object-fit:cover; background:#fff; border-radius:24px; box-shadow:0 8px 20px rgba(0,0,0,.3),0 6px 30px rgba(245,158,11,.25); display:block; }
  .logo-wrap .unicef { width:250px; height:250px; object-fit:contain; background:#fff; border-radius:24px; box-shadow:0 8px 20px rgba(0,0,0,.3),0 6px 30px rgba(245,158,11,.25); display:block; }

  .form-title { text-align:center; font-size:20px; font-weight:900; }
  .form-sub { text-align:center; font-size:13px; color:rgba(255,255,255,.6); font-weight:600; margin-top:6px; }
  .field { margin-top:14px; }
  .field label { display:block; font-size:13px; color:rgba(255,255,255,.65); margin-bottom:6px; font-weight:600; }
  .field input, .field select { width:100%; padding:14px 16px; border-radius:16px; border:1.2px solid rgba(255,255,255,.24); background:rgba(255,255,255,.08); color:#fff; font-family:inherit; font-size:15px; font-weight:600; outline:none; }
  .field input:focus, .field select:focus { border-color:#F59E0B; }
  .field select { appearance:none; }
  .field select option { background:#3B1480; color:#fff; }
  .field .err { color:#FCA5A5; font-size:12px; margin-top:5px; display:none; font-weight:600; }

  .btn { width:100%; padding:15px; margin-top:22px; border:none; border-radius:16px; font-family:inherit; font-size:17px; font-weight:900; cursor:pointer; transition:filter .2s; display:block; text-align:center; }
  .btn:active { filter:brightness(.92); }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn-gold { background:linear-gradient(90deg,#F59E0B,#FBBF24); color:#2E1065; }
  .btn-purple { background:#7C3AED; color:#fff; }
  .btn-row { display:flex; gap:10px; }
  .btn-row .btn { flex:1; margin-top:12px; padding:13px; font-size:15px; }

  .options { margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .option { display:flex; align-items:center; gap:12px; padding:12px; border-radius:18px; background:rgba(255,255,255,.08); border:1.4px solid rgba(255,255,255,.18); cursor:pointer; transition:all .25s ease; user-select:none; }
  .option:active { transform:scale(.98); }
  .letter { width:40px; height:40px; border-radius:50%; background:#7C3AED; color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:900; box-shadow:0 3px 8px rgba(46,16,101,.35); flex-shrink:0; }
  .option .label { flex:1; font-size:15.5px; font-weight:600; line-height:1.4; }
  .option.correct { background:#10B981; border-color:#34D399; }
  .option.correct .letter { background:#FBBF24; color:#2E1065; }
  .option.wrong { background:#DC2626; border-color:#F87171; }
  .option.disabled { pointer-events:none; }

  .instruction { padding:12px 14px; border-radius:16px; background:rgba(245,158,11,.10); border:1.2px solid rgba(245,158,11,.4); text-align:center; font-size:14px; font-weight:700; margin-top:14px; }
  .grid { margin-top:14px; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .vcard { aspect-ratio:.72; border-radius:18px; background:linear-gradient(135deg,#4C1D95,#7C3AED); border:2px solid rgba(255,255,255,.24); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; transition:transform .12s ease, box-shadow .4s, border-color .3s, opacity .4s; }
  .vcard .num { font-size:24px; font-weight:900; }
  .vcard .qmark { font-size:16px; color:rgba(255,255,255,.54); font-weight:700; }
  .vcard.winner { background:linear-gradient(90deg,#F59E0B,#FBBF24); border-color:#FBBF24; animation:winPulse .55s ease-in-out infinite; z-index:5; }
  .vcard.winner .num { color:#2E1065; }
  .vcard.winner .qmark { color:rgba(46,16,101,.7); }
  .vcard.dim { opacity:.25; }
  @keyframes winPulse {
    0%,100%{ transform:scale(1.12) rotate(-3deg); box-shadow:0 0 20px rgba(245,158,11,.8), 0 0 0 0 rgba(245,158,11,.55); }
    50%{ transform:scale(1.3) rotate(3deg); box-shadow:0 0 34px rgba(245,158,11,.95), 0 0 0 16px rgba(245,158,11,0); }
  }
  .grid-wrap { position:relative; margin-top:12px; }
  .grid-wrap .grid { margin-top:0; }
  .scanline { position:absolute; inset:0; border-radius:18px; overflow:hidden; pointer-events:none; opacity:0; z-index:3; }
  .grid-wrap.scan .scanline { opacity:1; }
  .scanline::before { content:''; position:absolute; top:-10%; bottom:-10%; width:70px; left:-90px; background:linear-gradient(90deg,rgba(251,191,36,0),rgba(251,191,36,.55),rgba(251,191,36,.12),rgba(251,191,36,0)); animation:scanmove .38s linear infinite; }
  @keyframes scanmove { from{left:-90px;} to{left:105%;} }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:18px; }
  .overlay.show { display:flex; }
  .dialog { width:100%; max-width:380px; background:linear-gradient(135deg,#1E1147,#3B1480); border-radius:28px; border:2px solid #F59E0B; padding:26px 22px 22px; text-align:center; box-shadow:0 8px 28px rgba(245,158,11,.35),0 16px 40px rgba(0,0,0,.45); animation:pop .5s cubic-bezier(.34,1.56,.64,1); position:relative; z-index:60; max-height:90vh; overflow-y:auto; }
  @keyframes pop { 0%{transform:scale(.6);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .dialog.plain { border-color:rgba(255,255,255,.24); box-shadow:0 16px 40px rgba(0,0,0,.5); }
  .star { font-size:110px; line-height:1; animation:starPop .6s cubic-bezier(.34,1.56,.64,1); filter:drop-shadow(0 0 30px rgba(245,158,11,.6)); }
  @keyframes starPop { 0%{transform:scale(0);} 100%{transform:scale(1);} }
  .dialog h2 { font-size:25px; font-weight:900; margin-top:14px; }

  .gift-box { margin-top:20px; padding:16px; border-radius:18px; background:rgba(245,158,11,.12); border:1.4px solid rgba(245,158,11,.55); }
  .gift-box .small { font-size:14.5px; color:rgba(255,255,255,.85); font-weight:600; }
  .gift-box .big { font-size:23px; font-weight:900; margin-top:8px; }
  .answer-box { margin-top:18px; padding:14px; border-radius:16px; background:rgba(16,185,129,.14); border:1px solid rgba(16,185,129,.5); font-size:15.5px; font-weight:800; line-height:1.6; }
  .exp-box { margin-top:12px; padding:14px; border-radius:16px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); text-align:right; }
  .exp-box .ttl { color:#FBBF24; font-size:13px; font-weight:800; }
  .exp-box p { font-size:14.5px; line-height:1.65; margin-top:6px; font-weight:500; color:rgba(255,255,255,.95); }
  .dialog .hint { font-size:13.5px; color:rgba(255,255,255,.7); font-weight:600; margin-top:6px; }
  .num-reveal { text-align:center; }
  .num-reveal .lbl { font-size:22px; font-weight:900; color:#FBBF24; }
  .num-reveal .big { font-size:130px; line-height:1.05; font-weight:900; color:#fff; text-shadow:0 0 46px rgba(245,158,11,.9), 0 10px 20px rgba(0,0,0,.35); margin-top:4px; animation:pop .55s cubic-bezier(.34,1.56,.64,1); }
  .num-reveal .sub { font-size:16px; color:rgba(255,255,255,.85); font-weight:700; margin-top:12px; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:55; }

  .admin-shell { width:100%; max-width:500px; max-height:92vh; background:linear-gradient(135deg,#1E1147,#3B1480); border-radius:26px; padding:18px; display:flex; flex-direction:column; gap:12px; overflow:hidden; position:relative; z-index:60; }
  .admin-head { display:flex; align-items:center; justify-content:space-between; }
  .admin-head b { font-size:18px; font-weight:900; }
  .admin-close { background:rgba(255,255,255,.1); border:none; color:#fff; width:36px; height:36px; border-radius:10px; font-size:16px; cursor:pointer; }
  .admin-card { background:rgba(255,255,255,.07); border:1.2px solid rgba(255,255,255,.14); border-radius:16px; padding:14px; }
  .admin-count { color:#FBBF24; font-weight:900; font-size:15px; margin-bottom:10px; }
  .admin-card input { width:100%; padding:12px 14px; border-radius:12px; border:1.2px solid rgba(255,255,255,.24); background:rgba(255,255,255,.08); color:#fff; font-family:inherit; font-size:13px; outline:none; }
  .admin-card input:focus { border-color:#F59E0B; }
  .admin-status { text-align:center; color:#FBBF24; font-size:12.5px; font-weight:700; margin-top:8px; min-height:18px; }
  .admin-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .arec { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 12px; }
  .arec .n { font-size:14px; font-weight:900; display:flex; justify-content:space-between; }
  .arec .n span.tag { font-size:11px; padding:2px 8px; border-radius:8px; font-weight:900; }
  .tag.ok { background:rgba(16,185,129,.2); color:#34D399; }
  .tag.bad { background:rgba(220,38,38,.2); color:#F87171; }
  .tag.no { background:rgba(255,255,255,.1); color:rgba(255,255,255,.5); }
  .arec .d { font-size:12.5px; color:rgba(255,255,255,.7); font-weight:600; margin-top:4px; }

  .view { display:none; position:relative; }
  .view.active { display:block; }

  @media (min-width:768px){
    .phone { max-width:680px; padding:32px 28px 40px; }
    .title-badge span { font-size:24px; }
    .blob { display:none; }
    .card { padding:20px; }
  }

  @media (max-width:767.98px){
    .logo-wrap .logo-main, .logo-wrap .unicef { width:150px; height:150px; border-radius:18px; }
  }
</style>
</head>

<script>

const GIFTS=[{icon:'☕',name:'مج أنيق'},{icon:'🧢',name:'كاب مميز'},{icon:'💾',name:'فلاشة'},{icon:'💧',name:'زجاجة مياه'}];
const GOVERNORATES=['القاهرة','الإسكندرية','الجيزة','القليوبية','المنوفية','الغربية','الدقهلية','الشرقية','كفر الشيخ','دمياط','البحيرة','الإسماعيلية','السويس','بورسعيد','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];

const QUESTIONS=[
{fact:'تسعى الدولة جاهدة لتذليل كافة العقبات أمام المستثمرين من أجل جذب الاستثمارات وتوفير فرص عمل جديدة لخفض معدلات البطالة، فقد بلغ رأس مال الشركات التي تم تأسيسها 198 مليار جنيه خلال العام المالي 2023 / 2024 مقابل 116 مليار جنيه خلال العام المالي 2022 / 2023 بنسبة ارتفاع قدرها 71.5%.',question:'كم بلغ رأس مال الشركات التي تم تأسيسها خلال العام المالي 2023 / 2024؟',options:['198 مليار جنيه','80 مليار جنيه','116 مليار جنيه'],correct:0,expl:'سجل رأس مال الشركات المؤسسة حديثاً 198 مليار جنيه عام 2023/2024 بارتفاع 71.5% عن العام السابق الذي بلغ 116 مليار جنيه.'},
{fact:'نهر النيل شريان الحياة.. تبلغ حصة مصر منه 55.5 مليار متر مكعب.. فمنذ أكثر من مائة عام بلغ متوسط نصيب الفرد من مياه النيل 4.4 ألف متر مكعب عام 1917 حيث بلغ عدد السكان حينها 12.7 مليون نسمة، ولكن مع الزيادة السكانية وبلوغ عدد سكان مصر 108.5 مليون نسمة بلغ متوسط نصيب الفرد 511.5 متر مكعب عام 2025.',question:'كم بلغ متوسط نصيب الفرد من مياه النيل عام 2025؟',options:['530 متر مكعب','511.5 متر مكعب','550 متر مكعب'],correct:1,expl:'بسبب الزيادة السكانية انخفض نصيب الفرد من مياه النيل إلى 511.5 متر مكعب عام 2025 مقارنة بـ 4.4 ألف متر مكعب عام 1917.'},
{fact:'تعد السكك الحديدية مرفقاً حيوياً توليه الدولة اهتماماً كبيراً من التطوير والتجديد؛ حيث تقوم بنقل ملايين الركاب والبضائع من وإلى المحافظات لامتداد أطوالها بجميع أنحاء الجمهورية، فقد سجلت إيرادات السكك الحديدية 8 مليارات جنيه خلال أول 10 شهور من عام 2025 مقابل 5.8 مليار جنيه خلال نفس الفترة من عام 2024 بنسبة ارتفاع قدرها 38%.',question:'كم بلغت إيرادات السكك الحديدية أول 10 شهور من عام 2025؟',options:['2.6 مليار جنيه','8 مليارات جنيه','5.8 مليار جنيه'],correct:1,expl:'بلغت إيرادات السكك الحديدية 8 مليارات جنيه في أول 10 شهور من 2025 بارتفاع 38% عن نفس الفترة من عام 2024.'},
{fact:'تعد مصر مقصداً سياحياً هاماً للعديد من دول العالم لموقعها الجغرافي المتميز وطبيعتها الساحرة وما تحتويه من آثار؛ والتي تعد مهد الديانات وملتقى القارات وأرض الحضارات، فقد زار مصر من مختلف دول العالم 15.8 مليون سائح عام 2024 مقابل 14.9 مليون سائح عام 2023 بنسبة ارتفاع قدرها 5.9%.',question:'كم عدد السائحين الذين زاروا مصر خلال عام 2024؟',options:['14.9 مليون سائح','15.8 مليون سائح','20.5 مليون سائح'],correct:1,expl:'استقبلت مصر 15.8 مليون سائح عام 2024 بنمو 5.9% عن العام السابق الذي سجل 14.9 مليون سائح.'},
{fact:'تمثل السياحة مورداً هاماً من موارد النقد الأجنبي لكافة دول العالم.. لذا تحرص الدولة المصرية على الترويج السياحي من أجل جذب السائحين لزيارة مصر، فقد بلغت إيرادات السياحة 16.7 مليار دولار خلال عام 2024 / 2025 مقابل 14.4 مليار دولار خلال عام 2023 / 2024 بنسبة ارتفاع قدرها 16.3%.',question:'كم بلغت إيرادات السياحة خلال عام 2024 / 2025؟',options:['16.7 مليار دولار','4.9 مليار دولار','14.4 مليار دولار'],correct:0,expl:'سجلت إيرادات السياحة 16.7 مليار دولار عام 2024/2025 بنمو 16.3% عن العام السابق الذي بلغ 14.4 مليار دولار.'},

let bank=[...QUESTIONS], player=null, current=null, giftBag=[];
let tick=0, timer=null, winnerIdx=null, shuffling=false;
let records=JSON.parse(localStorage.getItem('kaw_records')||'[]');
const DEFAULT_SHEET='https://sheetdb.io/api/v1/ktsniib28s66u';
let gsheet=localStorage.getItem('kaw_gsheet')||DEFAULT_SHEET;
let remoteCache=[];

function persistRecords(){ localStorage.setItem('kaw_records', JSON.stringify(records)); }
function shuffle(a,rnd){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function initGovs(){ document.getElementById('pGov').innerHTML='<option value="">اختر المحافظة...</option>'+GOVERNORATES.map(g=>`<option value="${g}">${g}</option>`).join(''); }

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function homeToRegister(){
  document.getElementById('pName').value=''; document.getElementById('pAge').value=''; document.getElementById('pPhone').value=''; document.getElementById('pGov').value='';
  hideErr('eName'); hideErr('eAge'); hideErr('ePhone'); hideErr('eGov');
  renderCards(); show('view-reg');
}

function hideErr(id){ document.getElementById(id).style.display='none'; }
function showErr(id,msg){ const e=document.getElementById(id); e.textContent=msg; e.style.display='block'; }

function toast(msg,bad){
  let el=document.getElementById('regToast');
  if(!el){
    el=document.createElement('div'); el.id='regToast';
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;color:#fff;padding:12px 18px;border-radius:10px;font-weight:bold;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35);background:#1E7B4B';
    el.style.display='none'; document.body.appendChild(el);
  }
  el.style.background=bad?'#7A1F2B':'#1E7B4B';
  el.textContent=msg; el.style.display='block';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',5000);
}

function normalize(r){
  return {
    name:r.name, age:r.age, phone:r.phone,
    gov:r.governorate||r.gov||'',
    q:r.questionNumber!=null?r.questionNumber:r.q,
    result:r.result,

    t:r.answeredAt||r.t
  };
}

async function register(){
  const name=document.getElementById('pName').value.trim();
  const age=document.getElementById('pAge').value.trim();
  const phone=document.getElementById('pPhone').value.trim();
  const gov=document.getElementById('pGov').value;
  let ok=true;
  if(!name){ showErr('eName','من فضلك أدخل اسم المتسابق'); ok=false; } else hideErr('eName');
  const ageNum=parseInt(age,10);
  if(!ageNum||ageNum<8||ageNum>99){ showErr('eAge','أدخل سن صحيح بالأرقام'); ok=false; } else hideErr('eAge');
  if(!/^01[0-9]{9}$/.test(phone)){ showErr('ePhone','أدخل رقم تليفون صحيح (11 رقم)'); ok=false; } else hideErr('ePhone');
  if(!gov){ showErr('eGov','اختر المحافظة'); ok=false; } else hideErr('eGov');
  if(!ok) return;

  if(records.some(r=>String(r.phone)===phone)){
    showErr('ePhone','رقم التليفون ده شارك في المسابقة من قبل، مينفعش يشارك تاني');
    return;
  }

  const btn=document.getElementById('regBtn'), oldTxt=btn.textContent;
  btn.disabled=true; btn.textContent='جاري التحقق من الرقم...';
  let remoteTaken=false;
  if(gsheet){
    try{
      const res=await fetch(gsheet+'/search?phone='+encodeURIComponent(phone));
      const js=await res.json();
      remoteTaken=Array.isArray(js)&&js.length>0;
    }catch(e){ remoteTaken=false; }
  }
  btn.disabled=false; btn.textContent=oldTxt;
  if(remoteTaken){
    showErr('ePhone','رقم التليفون ده شارك في المسابقة من قبل، مينفعش يشارك تاني');
    return;
  }

  player={name,age,phone,gov};
  document.getElementById('playerLine').textContent='المتسابق: '+name;
  if(gsheet){
    const r=await sendToSheet({name,age,phone,gov});
    if(r.ok) toast('✅ تم تسجيلك ووصلت بياناتك للجنة');
    else toast('⚠️ '+r.text,true);
  }
  else { toast('⚠️ لا يوجد رابط قاعدة بيانات — سجلت محلياً فقط',true); }
  renderCards(); show('view-cards');
}

function renderCards(){
  const grid=document.getElementById('cardsGrid');
  grid.innerHTML=bank.map((q,i)=>{
    const num=QUESTIONS.indexOf(q)+1;
    return `<div class="vcard" id="card-${i}" style="transform:translate(0,0) rotate(0deg)"><div style="font-size:26px">🏆</div><div class="num">${num}</div><div class="qmark">؟</div></div>`;
  }).join('');
  document.getElementById('cardsHint').textContent='اختار كارت سؤالك بالضغط على «دوّر الكروت» - سؤال واحد لكل متسابق وممكن السؤال يتكرر مع غيرك';
  const btn=document.getElementById('shuffleBtn');
  btn.disabled=false; btn.textContent='🎲 دوّر الكروت';
}

function startShuffle(){
  if(shuffling) return;
  shuffling=true; tick=0; winnerIdx=null;
  const btn=document.getElementById('shuffleBtn'); btn.disabled=true; btn.textContent='🌀 الكروت بتتقلب دلوقتي...';
  document.getElementById('cardsHint').textContent='🌀 الكروت بتتقص وتتقلب، ومفيش حد يعرف هيقف على إيه!';
  document.getElementById('gridWrap').classList.add('scan');
  timer=setInterval(()=>{
    tick++;
    document.querySelectorAll('.vcard').forEach(el=>{
      const a=Math.random()*1.1-0.55;
      const s=1+Math.random()*0.22;
      const dx=Math.random()*18-9, dy=Math.random()*18-9;
      el.style.transform=`translate(${dx}px,${dy}px) rotate(${a}rad) scale(${s})`;
    });
    if(tick>=16){ clearInterval(timer); pickWinner(); }
  },45);
}

function pickWinner(){
  shuffling=false;
  winnerIdx=Math.floor(Math.random()*bank.length);
  document.getElementById('gridWrap').classList.remove('scan');
  document.querySelectorAll('.vcard').forEach(el=>{ el.style.transform='translate(0,0) rotate(0deg) scale(1)'; });
  document.getElementById('card-'+winnerIdx).classList.add('winner');
  document.getElementById('cardsHint').textContent='🔥 العملة اختارت الكارت... اتفرج!';
  document.getElementById('shuffleBtn').textContent='🎉 الكارت وقف!';
  burstConfetti();
  setTimeout(()=>{
    const num=QUESTIONS.indexOf(bank[winnerIdx])+1;
    document.getElementById('numReveal').innerHTML=`<div class="lbl">🔥 رقم سؤالك هو</div><div class="big">${num}</div><div class="sub">جهز نفسك... السؤال ظاهر بعد لحظات</div>`;
    document.getElementById('numOverlay').classList.add('show');
    burstConfetti();
  },800);
  setTimeout(()=>{
    document.getElementById('numOverlay').classList.remove('show');
    showQuiz(bank[winnerIdx]);
  },2900);
}

function showQuiz(q){
  const pairs=shuffle([0,1,2].map(i=>[i,q.options[i]]),Math.random);
  const opts=pairs.map(e=>e[1]), correctDisplay=pairs.findIndex(e=>e[0]===q.correct);
  current={orig:q, displayOpts:opts, correctDisplay};
  document.getElementById('quizBody').innerHTML=`
    <div class="card fact-card">
      <div class="card-title">💡 معلومة سريعة</div>
      <p class="fact-text">${q.fact}</p>
    </div>
    <div class="card q-card">
      <div class="card-title">❓ سؤال المسابقة</div>
      <p class="q-text">${q.question}</p>
      <div class="options">
        ${opts.map((o,i)=>`<div class="option" data-i="${i}" onclick="answer(${i})"><div class="letter">${LETTERS[i]}</div><div class="label">${o}</div></div>`).join('')}
      </div>
    </div>`;
  show('view-quiz');
}

function answer(i){
  if(!current) return;
  const opts=[...document.querySelectorAll('.option')];
  opts.forEach(o=>o.classList.add('disabled'));
  const qNum=QUESTIONS.indexOf(current.orig)+1;
  if(i===current.correctDisplay){
    opts[i].classList.add('correct');
    finishRecord('صحيح',qNum);
    setTimeout(()=>correctDialog(),900);
  }else{
    opts[i].classList.add('wrong');
    opts[current.correctDisplay].classList.add('correct');
    finishRecord('خطأ',qNum);
    setTimeout(()=>wrongDialog(),900);
  }
}

function finishRecord(result,qNum){
  if(!player) return;
  const r={name:player.name,age:player.age,phone:player.phone,gov:player.gov,q:qNum,result:result,t:new Date().toISOString()};
  records.push(r);
  persistRecords();
  refreshAdmin();
}

function takeGift(){ if(giftBag.length===0) giftBag=shuffle([...GIFTS],Math.random); return giftBag.pop(); }

function showDialog(html,cls){ const d=document.getElementById('dialog'); d.className='dialog'+(cls?' '+cls:''); d.innerHTML=html; document.getElementById('overlay').classList.add('show'); }
function closeDialog(){ document.getElementById('overlay').classList.remove('show'); }

function correctDialog(){
  const g=takeGift();
  showDialog(`
    <div class="star">⭐</div>
    <h2>🎉 مبروك كسبت!</h2>
    <div class="gift-box"><div class="small">كسبت معانا:</div><div class="big">${g.icon} ${g.name}</div></div>
    <button class="btn btn-gold" onclick="exitToMenu()">العودة للقائمة الرئيسية</button>`);
  burstConfetti();
}

function wrongDialog(){
  showDialog(`
    <div style="font-size:56px">❌</div>
    <h2>حظ سعيد المرة القادمة!</h2>
    <div class="hint">لا تقلق، خسارة محاولة لا تعني خسارة اللعبة.</div>
    <div class="answer-box">الإجابة الصحيحة: [${LETTERS[current.correctDisplay]}]<br>${current.displayOpts[current.correctDisplay]}</div>
    <div class="exp-box"><div class="ttl">💡 توضيح</div><p>${current.expl}</p></div>
    <button class="btn btn-purple" onclick="exitToMenu()">العودة للقائمة الرئيسية</button>`,'plain');
}

function exitToMenu(){
  closeDialog(); current=null;
  homeToRegister();
}

// ========== النتائج والتصدير ==========
function openAdmin(){ refreshAdmin(); document.getElementById('adminOverlay').classList.add('show'); document.getElementById('gsheetUrl').value=gsheet; }
function closeAdmin(){ document.getElementById('adminOverlay').classList.remove('show'); }

function mergedRecords(){
  const byPhone=new Map();
  (remoteCache||[]).forEach(r=>{ const n=normalize(r); byPhone.set(String(n.phone),n); });
  records.forEach(r=>{ const k=String(r.phone); if(!byPhone.has(k)) byPhone.set(k,r); });
  return [...byPhone.values()];
}

async function refreshAdmin(){
  let remote=[];
  if(gsheet){
    try{
      const res=await fetch(gsheet);
      const js=await res.json();
      remote=Array.isArray(js)?js:[];
    }catch(e){ remote=[]; }
  }
  remoteCache=remote;
  renderAdmin(mergedRecords());
}

function renderAdmin(rows){
  document.getElementById('adminCount').textContent='عدد المتسابقين (من كل المصادر): '+rows.length;
  const list=document.getElementById('adminList');
  list.innerHTML=rows.slice().reverse().map(r=>{
    const tag=r.result==='صحيح'?'<span class="tag ok">صحيح</span>': r.result==='خطأ'?'<span class="tag bad">خطأ</span>':'';
    const remotePhones=(remoteCache||[]).map(x=>String(x.phone));
    const src=remotePhones.indexOf(String(r.phone))>=0 ? '<span class="tag no">☁️ من Google Sheet</span>' : '<span class="tag no">🔒 هذا الجهاز</span>';
    return `<div class="arec"><div class="n"><span>👤 ${r.name}</span>${tag}${src}</div><div class="d">سن ${r.age} | ${r.phone} | ${r.gov}${r.q?' | سؤال '+r.q:''}</div></div>`;
  }).join('')||'<div style="text-align:center;color:rgba(255,255,255,.5);padding:20px;font-size:14px">لا يوجد متسابقين حتى الآن</div>';
}

function csvField(v){ v=String(v==null?'':v); return (v.indexOf(',')>=0||v.indexOf('"')>=0)?'"'+v.replace(/"/g,'""')+'"':v; }

function downloadCsv(){
  const all=mergedRecords();
  if(all.length===0){ document.getElementById('adminStatus').textContent='لا يوجد بيانات للتصدير'; return; }
  let csv='\uFEFF' + 'الاسم,السن,رقم التليفون,المحافظة,رقم السؤال,النتيجة,التوقيت\n';
  all.forEach(r=>{
    csv += [csvField(r.name),csvField(r.age),csvField(r.phone),csvField(r.gov),csvField(r.q),csvField(r.result),csvField((r.t||'').replace('T',' ').slice(0,16))].join(',')+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='نتائج_اعرف_واكسب.csv'; a.click();
  document.getElementById('adminStatus').textContent='✔ تم تحميل ملف Excel';
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

function saveSheetUrl(){ gsheet=document.getElementById('gsheetUrl').value.trim(); localStorage.setItem('kaw_gsheet',gsheet); document.getElementById('adminStatus').textContent=gsheet?'✔ تم حفظ الرابط، المتسابقين الجدد يترسلوا تلقائياً':'تم مسح الرابط'; refreshAdmin(); }

async function sendToSheet(r){
  if(!gsheet) return {ok:false,text:'لا يوجد رابط قاعدة بيانات (لوحة الأدمن)'};
  const body=new URLSearchParams();
  body.set('name',r.name); body.set('age',r.age); body.set('phone',"'"+r.phone); body.set('governorate',r.gov||r.governorate);
  try{
    const res=await fetch(gsheet,{method:'POST',body:body});
    const t=await res.text();
    if(res.ok) return {ok:true,text:t};
    return {ok:false,text:'الخادم رفض الطلب ('+res.status+'): '+(t||'').slice(0,120)};
  }catch(e){ return {ok:false,text:'فشل الوصول: '+String(e)}; }
}

function sendAllToSheet(){
  if(!gsheet){ document.getElementById('adminStatus').textContent='أولاً أدخل رابط قاعدة البيانات (SheetDB) وحفظه'; return; }
  document.getElementById('adminStatus').textContent='جاري الإرسال...';
  mergedRecords().forEach(r=>sendToSheet(normalize(r)));
  document.getElementById('adminStatus').textContent='✔ تم إرسال البيانات';
}

function clearAll(){
  if(!confirm('هل أنت متأكد من مسح كل بيانات المتسابقين؟')) return;
  records=[]; persistRecords(); refreshAdmin(); document.getElementById('adminStatus').textContent='تم مسح بيانات هذا الجهاز فقط (الجدول لم يتأثر)';
}

// فتح لوحة الأدمن: ضغطة مطولة (ثانية ونص) على شعار «اعرف واكسب» - لوحة النتائج والتصدير مش ظاهرة للجمهور
let adminLongPress=null;
function bindAdminGesture(){
  const tb=document.querySelector('.title-badge');
  if(!tb) return;
  const start=(e)=>{ e.preventDefault(); adminLongPress=setTimeout(()=>{ openAdmin(); },1500); };
  const cancel=()=>{ clearTimeout(adminLongPress); adminLongPress=null; };
  tb.addEventListener('pointerdown',start);
  tb.addEventListener('pointerup',cancel);
  tb.addEventListener('pointerleave',cancel);
  tb.addEventListener('pointercancel',cancel);
}

// ====== Confetti ======
const cv=document.getElementById('confetti'), ctx=cv.getContext('2d');
let particles=[], animating=false;
function sizeCanvas(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
const CONF_COLORS=['#F59E0B','#FBBF24','#7C3AED','#A78BFA','#10B981','#FFFFFF'];
function burstConfetti(){
  for(let i=0;i<90;i++) particles.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.3,vx:(Math.random()-0.5)*9,vy:2+Math.random()*6,w:6+Math.random()*7,h:6+Math.random()*7,color:CONF_COLORS[Math.floor(Math.random()*CONF_COLORS.length)],rot:Math.random()*Math.PI,vr:(Math.random()-0.5)*0.25,gravity:0.18});
  if(!animating){ animating=true; requestAnimationFrame(loop); }
}
function loop(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(particles.length===0){ animating=false; return; }
  particles.forEach(p=>{ p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); });
  particles=particles.filter(p=>p.y<cv.height+20);
  requestAnimationFrame(loop);
}

initGovs(); renderCards(); bindAdminGesture();

// ====== منع أي إزاحة أفقية (انزلاق لليمين) على الموبايل - تثبيت حتمي ======
function lockHScroll(){
  const d=document.documentElement, b=document.body;
  d.style.overflowX='hidden'; b.style.overflowX='hidden';
  if(window.scrollX||document.documentElement.scrollLeft||document.body.scrollLeft){
    window.scrollTo(0, window.scrollY||document.documentElement.scrollTop||document.body.scrollTop);
  }
}
window.addEventListener('scroll',()=>{ if(window.scrollX) window.scrollTo(0, window.scrollY); },{passive:true});
window.addEventListener('resize',()=>{ sizeCanvas(); lockHScroll(); });
window.addEventListener('load',lockHScroll);
lockHScroll();
